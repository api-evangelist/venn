aid: venn
name: Venn
description: >-
  Venn is a multifamily resident-experience operating system for owner-operators of
  rental housing. Founded in 2016 and co-headquartered in New York and Tel Aviv, it
  merges a resident-facing mobile app, an operator dashboard and a single data layer
  over the resident lifecycle — leasing, onboarding, living, renewals, maintenance,
  payments, community programming and an AI concierge — synced with the property
  management system of record (Yardi, RealPage, Entrata, AppFolio). Venn runs an
  unversioned Apollo Federation GraphQL API at api.venn.city with anonymous
  introspection enabled, 320 query fields and 357 mutation fields across 468 object
  types, authenticated with AWS Cognito bearer tokens. It publishes no developer
  portal, API reference, OpenAPI or pricing; the contract is discoverable but the
  data and the docs are not public.
