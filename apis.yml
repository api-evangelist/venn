apis:
- name: Venn Tenant GraphQL API
  description: >-
    Venn's tenant-facing GraphQL API, served through an Apollo Federation gateway on
    AWS API Gateway. Anonymous introspection returns the full contract — 1,983 types,
    320 query fields, 357 mutation fields, no subscriptions — covering the property
    graph (portfolio, community, building, unit, bedroom), residents and identity,
    leasing and contracts, billing and payments, community engagement, broadcasts and
    notifications, services and commerce, shared-space bookings, surveys and
    configuration. Reads and writes require a Cognito bearer token; an unauthenticated
    query returns VennUnknownError. Cursor pagination is mandatory on every list field.
  humanURL: https://docs.venn.city/
  baseURL: https://api.venn.city/production/graphql
