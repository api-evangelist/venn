note: >-
  Venn publishes under the public `@venncity` npm scope (20 packages, all
  first-party; the scope is Venn's, published by the `venncity-admin` account per
  the extension-sdk README). Only two are integration-facing and current:
  `@venncity/extension-sdk` (the Venn Extensions bridge, first published
  2026-08-24) and `@venncity/bi-events` (the typed BI event catalog). The
  remaining eighteen are backend framework libraries from Venn's `graphql-clou`
  stack — real, first-party, but internal build-time dependencies rather than API
  client libraries, and most last shipped in 2022-2023. No PyPI, RubyGems,
  crates.io, NuGet, Maven Central or Go module was found for Venn. There is no
  general-purpose client SDK for the Venn tenant GraphQL API; consumers use a
  standard GraphQL client (Venn's own dashboard uses Apollo Client) against
  https://api.venn.city/production/graphql.
